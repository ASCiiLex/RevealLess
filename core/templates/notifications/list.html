{% extends 'base.html' %}

{% block content %}
<h2>Notificaciones</h2>

{% for n in notifs %}
    <div class="card mb-2">
        <div class="card-body">
            <a href="{{ n.url }}">{{ n.text }}</a>
            <br>
            <small class="text-muted">{{ n.created_at }}</small>
        </div>
    </div>
{% empty %}
    <p>No tienes notificaciones.</p>
{% endfor %}
{% endblock %}
