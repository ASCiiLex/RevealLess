{% extends 'base.html' %}
{% block content %}
<div class="container mt-4">
    <h2 class="mb-4">¿Por dónde vas en {{ obra.titulo }}?</h2>
    <p class="text-muted">Necesitamos saber esto para protegerte de spoilers antes de que publiques sobre esta obra.</p>
    <form method="POST">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-primary mt-3">Guardar progreso</button>
    </form>
</div>
{% endblock %}
