{% extends 'base.html' %}

{% block content %}

<style>
.saved-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
    gap: 15px;
}

.saved-grid img {
    width: 100%;
    height: 250px;
    object-fit: cover;
    border-radius: 10px;
    transition: transform 0.2s ease;
}

.saved-grid img:hover {
    transform: scale(1.03);
}
</style>

<h2 class="mb-4">Guardados</h2>

{% if saved %}
    <div class="saved-grid">
        {% for item in saved %}
            <a href="/posts/{{ item.post.id }}/">
                {% if item.post.image %}
                    <img src="{{ item.post.image_url }}">
                {% else %}
                    <img src="/static/img/default_post.jpg">
                {% endif %}
            </a>
        {% endfor %}
    </div>
{% else %}
    <p class="text-muted">No has guardado ninguna publicación.</p>
{% endif %}

{% endblock %}
