<div class="profile-grid">
    {% for post in posts %}
        <div class="profile-grid-card">

            <a href="/posts/{{ post.id }}/">
                {% if post.image %}
                    <img src="{{ post.image_url }}">
                {% else %}
                    <img src="/static/img/default_post.jpg">
                {% endif %}
            </a>

            {% if user.is_authenticated %}
                <div class="profile-grid-actions">

                    {% if post.id in saved_posts_ids %}
                        <a href="{% url 'unsave_post' post.id %}"
                           class="btn btn-sm btn-warning">
                            Guardado
                        </a>
                    {% else %}
                        <a href="{% url 'save_post' post.id %}"
                           class="btn btn-sm btn-outline-warning">
                            Guardar
                        </a>
                    {% endif %}

                </div>
            {% endif %}

        </div>
    {% endfor %}
</div>
