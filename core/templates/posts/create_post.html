{% extends 'base.html' %}
{% load static %}

{% block content %}

<div class="container mt-4">
    <h2 class="mb-4">Crear publicación · {{ obra.titulo }}</h2>

    <form method="POST" enctype="multipart/form-data">
        {% csrf_token %}

        {{ form.as_p }}

        <div id="suggestedHashtags" class="d-flex flex-wrap gap-2 mt-3"></div>

        <button type="submit" class="btn btn-primary mt-3">
            Publicar
        </button>
    </form>
</div>

{% endblock %}

{% block scripts %}
<script src="{% static 'js/autocomplete.js' %}"></script>
{% endblock %}
