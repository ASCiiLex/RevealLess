{% load static %}
{% load text_filters %}

<div class="card-body">
    <h3>Post de {{ post.author.username }}</h3>
    <p>{{ post.text|urlize_mentions|urlize_hashtags|safe }}</p>

    <!-- 🔥 SIEMPRE mostramos imagen (con fallback automático) -->
    <img src="{{ post.image_url }}" class="img-fluid mt-3">

    <div class="mt-3 d-flex align-items-center gap-2">

        {% if user.is_authenticated %}
            <button class="react-btn"
                    data-type="post"
                    data-id="{{ post.id }}">
                <span class="reaction-icon">
                    {% if post_reaction == 'like' %}👍{% endif %}
                    {% if post_reaction == 'love' %}❤️{% endif %}
                    {% if post_reaction == 'funny' %}😂{% endif %}
                    {% if post_reaction == 'wow' %}😮{% endif %}
                    {% if post_reaction == 'sad' %}😢{% endif %}
                    {% if not post_reaction %}
                        <svg class="heart-icon" viewBox="0 0 24 24">
                            <path d="M12.1 8.64l-.1.1-.11-.1C9.14 6.09 5.6 6.7 3.6 9.05c-2.04 2.39-1.67 5.97.83 8.05L12 21l7.57-3.9c2.5-2.08 2.87-5.66.83-8.05-2-2.35-5.54-2.96-8.3-.41z"
                                  fill="none" stroke="#e0245e" stroke-width="2"/>
                        </svg>
                    {% endif %}
                </span>
            </button>

            <div class="reaction-menu">
                <span class="reaction-option" data-type="post" data-id="{{ post.id }}" data-reaction="like">👍</span>
                <span class="reaction-option" data-type="post" data-id="{{ post.id }}" data-reaction="love">❤️</span>
                <span class="reaction-option" data-type="post" data-id="{{ post.id }}" data-reaction="funny">😂</span>
                <span class="reaction-option" data-type="post" data-id="{{ post.id }}" data-reaction="wow">😮</span>
                <span class="reaction-option" data-type="post" data-id="{{ post.id }}" data-reaction="sad">😢</span>
            </div>
        {% endif %}

        <button class="reaction-count like-box"
                data-type="post"
                data-id="{{ post.id }}">
            <span class="count">{{ post.reactions.count }}</span> reacciones
        </button>

    </div>
</div>
