# Curación de estructura narrativa — Harry Potter (LIBROS)
# obra_external_id: creada vía crear_obra_manual (no hay fuente API para libros).
#
# AVISO IMPORTANTE: harrypotter.fandom.com (única fuente que agrupa los 199
# títulos en un solo sitio) sigue devolviendo HTTP 402 en esta sesión —
# igual que el resto de wikis Fandom usadas en este proyecto. Los títulos
# de este fichero proceden del propio conocimiento de esta obra (ampliamente
# publicada), NO de un cotejo capítulo a capítulo contra una fuente citable
# esta sesión. revisar: true en TODO el bloque de capítulos — recomendable
# una pasada de verificación contra la edición física antes de considerarlo
# definitivo, especialmente en libros 4-7 (mayor nº de capítulos).
#
# Fechas de publicación (Reino Unido, edición original): verificadas.
obra_external_id: {source: manual, external_id: harry-potter-libro}
sinopsis_en: [libro]   # nunca en capítulo suelto

