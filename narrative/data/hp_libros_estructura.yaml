# Curación de estructura narrativa — Harry Potter (LIBROS)
# obra_external_id: creada vía crear_obra_manual (no hay fuente API para libros).
#
# AVISO: harrypotter.fandom.com (única fuente con títulos de capítulo en
# español) devuelve HTTP 402 en esta sesión — igual que con el resto de
# wikis Fandom usadas en este proyecto. Los capítulos se numeran como
# placeholder ("Capítulo N") pendientes de título real (v2), mismo
# tratamiento que los episodios de anime sin título verificado.
#
# Fechas de publicación (Reino Unido, edición original): verificadas.
# Nº de capítulos por libro: verificado en varias fuentes en inglés.
# Libro 7: la mayoría de fuentes dan 36 capítulos + epílogo; una fuente
# consultada discrepaba con 37 — se usa 36 (cifra mayoritaria), revisar: true.
obra_external_id: {source: manual, external_id: harry-potter-libro}
sinopsis_en: [libro]   # nunca en capítulo suelto

