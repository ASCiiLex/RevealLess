# Curación de estructura narrativa — Marvel Cinematic Universe (PELÍCULAS)
# obra_external_id: creada vía crear_obra_manual (no hay fuente API para MCU).
#
# Obra ÚNICA para todo el UCM (mismo criterio que Star Wars: franquicia
# vendida y organizada bajo un solo título/marca, no productos separados
# como GoT/HotD). Así se evita el problema de a qué Obra asignar los
# crossover (Vengadores, Civil War...): no hay que elegir, solo hay una.
#
# Jerarquía: Fase → película, sin nivel de Saga intermedio.
# Orden = fecha de estreno real (mismo criterio que Star Wars y LOTR), no
# orden cronológico interno de la historia — el MCU no fija una única
# tabla cronológica oficial, y el estreno es el criterio ya validado en
# el resto del catálogo.
#
# 40 películas confirmadas con fecha oficial (Iron Man 2008 -> Avengers:
# Secret Wars 2027, verificado 2026-09-29). Quedan fuera 3 títulos
# anunciados para 2028 (X-Men, Ghost Rider, Black Panther III) por ser
# aún demasiado preliminares — mismo criterio que el arco abierto de One
# Piece (orden_local null).
# Fuente: https://en.wikipedia.org/wiki/List_of_Marvel_Cinematic_Universe_films
obra_external_id: {source: manual, external_id: mcu-peliculas}
tipo_unidad_raiz: fase

nodos:
  - tipo: fase
    nombre: "Fase Uno"
    orden_local: 1
    hijos:
