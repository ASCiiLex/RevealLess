# fecha_capitulos: pendiente de fuente adicional (aproximación por volumen, a decidir/incorporar más adelante).
#
# obra_external_id.external_id: MAL ID 13 (One Piece, Manga) — verificar antes de usar.
obra_external_id: {source: jikan, external_id: 13}
tipo_unidad_raiz: parte
sinopsis_en: [parte, saga, arco]   # nunca en capítulo suelto
fecha_capitulos: pendiente

