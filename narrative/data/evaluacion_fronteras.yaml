# Casos para medir la IA de fronteras: python manage.py evaluar_fronteras <este archivo> --modelo <modelo>
# Cada caso es una llamada real a la API por modelo evaluado.
#
# obra:       slug de la obra.
# texto:      lo que escribiría el usuario.
# referencia: (opcional) la parte que indicaría el autor.
# esperada:   la frontera correcta, es decir, lo que hay que haber visto para leerlo sin spoiler.
# Unidades por nombre exacto, «Padre · Nombre» si el nombre se repite, o por id.

# --- El Señor de los Anillos (Películas) ---
