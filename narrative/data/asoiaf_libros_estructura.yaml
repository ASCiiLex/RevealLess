# Curación de estructura narrativa — A Song of Ice and Fire (LIBROS)
# obra_external_id: creada vía crear_obra_manual (no hay fuente API para libros).
#
# Capítulos: los 3 primeros libros llevan título real — en esta saga el
# "título" de cada capítulo ES el nombre del POV (Bran I, Daenerys II...),
# igual en la edición española, así que no hay riesgo de traducción.
# Verificados contra A Wiki of Ice and Fire (awoiaf.westeros.org, no
# Fandom) y contrastado el total contra la cifra de capítulos conocida
# de cada libro (73/70/82).
#
# Festín de Cuervos y Danza de Dragones: la tabla de capítulos se cortaba
# en cada intento de extracción y lo recuperado tenía inconsistencias —
# se dejan como placeholder numérico ("Capítulo N"), con el total
# (46 y 73) SIN verificar esta sesión contra una fuente citable
# (revisar: true) — pendiente de una pasada dedicada.
#
# Fechas: mes/año verificados (Wikipedia); día exacto no confirmado salvo
# en Danza de Dragones (12 julio 2011, estreno mundial simultáneo, bien
# conocido) — el resto usa día 1 del mes como aproximación, revisar: true.
obra_external_id: {source: manual, external_id: asoiaf-libros}

