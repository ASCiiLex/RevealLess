# Recuento verificado: El Hobbit 19; Comunidad 22 (Libro I: 12 + Libro II: 10);
# Dos Torres 21 (Libro III: 11 + Libro IV: 10); Retorno del Rey 19
# (Libro V: 10 + Libro VI: 9). Total 81 capítulos.
