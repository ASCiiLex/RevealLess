# Curación manual — Naruto (ANIME). Estructura por TEMPORADA de emisión/DVD
# (Wikipedia), no por arco narrativo — los arcos tienen tramos que se
# interrumpen y retoman más tarde (solapes reales entre episodios de
# distintos arcos), mientras que las temporadas son estrictamente
# secuenciales sin solape.
#
# IMPORTANTE: numeración de episodio CONTINUA en toda la Obra (1-720), no la
# numeración original de cada serie (que reinicia en 1 en Shippūden). Mismo
# criterio que One Piece. Necesario porque orden_local debe ser único por
# Obra — con la numeración original de cada serie, episodio 1 de Shippūden
# colisionaba con episodio 1 de Naruto y se "robaban" episodios entre Partes.
obra_external_id: {source: manual, external_id: naruto-anime}
sinopsis_en: [parte, saga]

nodos:
  - tipo: parte
    nombre: "Naruto"
    orden_local: 1
    hijos:
      - {tipo: temporada, nombre: "Temporada 1", orden_local: 1, vincular_episodios: [1, 35], fecha: "2002-10-03"}
      - {tipo: temporada, nombre: "Temporada 2", orden_local: 2, vincular_episodios: [36, 83], fecha: "2003-06-04"}
      - {tipo: temporada, nombre: "Temporada 3", orden_local: 3, vincular_episodios: [84, 131], fecha: "2004-05-19"}
      - {tipo: temporada, nombre: "Temporada 4", orden_local: 4, vincular_episodios: [132, 179], fecha: "2005-04-27"}
      - {tipo: temporada, nombre: "Temporada 5", orden_local: 5, vincular_episodios: [180, 220], fecha: "2006-04-12"}

