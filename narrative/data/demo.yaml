# Contenido de demo para la defensa: python manage.py cargar_demo
# Idempotente: se puede ejecutar varias veces sin duplicar nada.
#   --rehacer        borra y vuelve a crear las publicaciones de demo (tras cambiar una imagen o un texto)
#   --sin-progresos  no toca el progreso de las cuentas de demo
#
# Cuentas: alexuser publica. usuariodemo1 solo sigue el anime de One Piece (ve el cartel de
# God Valley, no las escenas); usuariodemo2 va al día con el manga (ve también las escenas).
# Ninguna debe seguir a alexuser ni estar suscrita a estas obras: así todo sale en Descubrir.
#
# Obras: si no existen se crean con titulo/tipo/categorias; si ya existen, solo se completan.
# Unidades: por nombre exacto, «Padre · Nombre» si se repite, {tipo, orden_local} o id.
# Emociones: claves de ClasificacionNarrativa.EMOCION_CHOICES (me_entusiasma, me_emociona...).

obras:
  - slug: the-one-piece-anime
    titulo: The One Piece
    tipo: serie
    categorias: [Anime, One Piece]
    adapta_a: one-piece-manga
    sinopsis: "Nueva adaptación animada del manga de Eiichiro Oda desde el principio, producida por WIT Studio para Netflix."
    previo_inicial: true

  - slug: one-piece-live-action
    titulo: One Piece (Live Action)
    sin_sufijo: true
    tipo: serie
    categorias: [Series, One Piece]
    adapta_a: one-piece-manga
    sinopsis: "Adaptación en imagen real de Netflix de las aventuras de Luffy y su tripulación."
    estructura: one_piece_live_action_estructura.yaml

  # En local nació de una sugerencia aprobada; donde no exista, se crea con este título.
  - slug: solo-leveling
    titulo: Solo Leveling
    sin_sufijo: true
    tipo: serie
    categorias: [Anime]
    sinopsis: "Sung Jinwoo, el cazador más débil, recibe un poder que le permite subir de nivel sin límite."
    estructura: solo_leveling_estructura.yaml

  - slug: kimetsu-no-yaiba-anime
    titulo: Kimetsu no Yaiba
    tipo: serie
    categorias: [Anime]
    sinopsis: "Tanjiro se une a los cazadores de demonios para devolver la humanidad a su hermana Nezuko."
    estructura: kimetsu_anime_estructura.yaml

# Unidades que se añaden a obras ya estructuradas.
unidades:
  - obra: one-piece-anime
    padre: Saga final
    tipo: pelicula
    orden_local: 4          # justo después del Arco de Elbaph (3)
    nombre: "One Piece Film: God Valley"

previos:
  - {obra: mcu-peliculas, antes_de: "Vengadores: Doomsday", fecha: 2026-12-18}
  - {obra: mcu-peliculas, antes_de: "Vengadores: Secret Wars", fecha: 2027-12-17}
  - {obra: one-piece-anime, antes_de: "One Piece Film: God Valley"}
  # Si la obra tenía el previo genérico de una sugerencia aprobada, pasa a ser el de la temporada 3.
  - {obra: solo-leveling, antes_de: "Temporada 3", reubicar_previo_inicial: true}
  - {obra: one-piece-live-action, antes_de: "Temporada 3: The Battle of Alabasta"}
  - {obra: kimetsu-no-yaiba-anime, antes_de: "Castillo Infinito – Parte 2"}

# hasta_previo_de: justo antes del previo (lo ve). previo: true: en el previo de una obra nueva.
progresos:
  - {usuario: usuariodemo1, obra: one-piece-anime, hasta_previo_de: "One Piece Film: God Valley"}
  - {usuario: usuariodemo1, obra: one-piece-manga, unidad: {tipo: capitulo, orden_local: 1158}}
  - {usuario: usuariodemo1, obra: the-one-piece-anime, previo: true}
  - {usuario: usuariodemo1, obra: one-piece-live-action, hasta_previo_de: "Temporada 3: The Battle of Alabasta"}
  - {usuario: usuariodemo1, obra: mcu-peliculas, hasta_previo_de: "Vengadores: Doomsday"}
  - {usuario: usuariodemo1, obra: solo-leveling, hasta_previo_de: "Temporada 3"}
  - {usuario: usuariodemo1, obra: kimetsu-no-yaiba-anime, hasta_previo_de: "Castillo Infinito – Parte 2"}

  - {usuario: usuariodemo2, obra: one-piece-anime, hasta_previo_de: "One Piece Film: God Valley"}
  - {usuario: usuariodemo2, obra: one-piece-manga, unidad: {tipo: capitulo, orden_local: 1196}}
  - {usuario: usuariodemo2, obra: the-one-piece-anime, previo: true}
  - {usuario: usuariodemo2, obra: one-piece-live-action, hasta_previo_de: "Temporada 3: The Battle of Alabasta"}
  - {usuario: usuariodemo2, obra: mcu-peliculas, hasta_previo_de: "Vengadores: Doomsday"}
  - {usuario: usuariodemo2, obra: solo-leveling, hasta_previo_de: "Temporada 3"}
  - {usuario: usuariodemo2, obra: kimetsu-no-yaiba-anime, hasta_previo_de: "Castillo Infinito – Parte 2"}

