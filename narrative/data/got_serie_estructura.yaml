# 8 temporadas, 73 episodios. Títulos en español (doblaje/emisión España,
# fuente FormulaTV) y fechas de emisión original en EE.UU. (Wikipedia).
# orden_local reinicia en 1 por temporada — nodos hijos explícitos, no
# vincular_episodios (que numera a nivel de Obra completa y colisionaría
# igual que en ASOIAF).
