# Curación de estructura narrativa — Attack on Titan / Shingeki no Kyojin (MANGA)
# Fase B: aplicar DESPUÉS de crear la Obra manualmente (ver comando más abajo).
# Se usa fuente manual en vez de Jikan (source=jikan, id 23390) porque el
# manga no necesita nada que solo dé Jikan (no trae capítulos de todas
# formas) y MyAnimeList está devolviendo 504 en esta sesión — evita
# depender de su disponibilidad para esta Obra en concreto.
#
# Estructura por Volumen (tankōbon), no por Arco todavía — los arcos
# narrativos (Trost, Titán Hembra, Choque de titanes, Alzamiento, Retorno
# a Shiganshina, Marley, arco final) quedan pendientes de una pasada
# posterior; por ahora Volumen es el nodo intermedio directo.
#
# Capítulos: título real (traducción propia al español a partir del
# título oficial en inglés de Wikipedia) y numeración 1-139 — se excluyen
# los "Side Story" (Capitán Levi, Cuaderno de Ilse) del conteo principal,
# igual que hace la numeración oficial de 139 capítulos; quedan fuera de
# este fichero, pendientes de modelarse como TemaTransversal si se quiere
# recuperar ese contenido más adelante.
# Fecha = fecha de publicación original japonesa del volumen (tankōbon).
# Fuente: https://en.wikipedia.org/wiki/List_of_Attack_on_Titan_chapters
